<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ricardo — perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #14161b;
    --panel: #1b1e25;
    --panel-line: #2b2f39;
    --text: #e7e4da;
    --muted: #8a8d97;
    --amber: #d6a24a;
    --amber-dim: #7c6534;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    min-height: 100vh;
  }

  body{
    display: flex;
    justify-content: center;
    padding: 8vh 20px 10vh;
  }

  main{
    width: 100%;
    max-width: 620px;
  }

  .stmt{
    color: var(--muted);
    font-size: 0.8rem;
    letter-spacing: 0.02em;
    margin: 0 0 28px;
  }
  .stmt .kw{ color: var(--amber); }

  .card{
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 4px;
    overflow: hidden;
  }

  .row{
    padding: 22px 26px;
    border-bottom: 1px solid var(--panel-line);
  }
  .row:last-child{ border-bottom: none; }

  .identity h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 2.1rem;
    margin: 0 0 6px;
    color: var(--text);
    line-height: 1.1;
  }
  .identity p{
    margin: 0;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.6;
  }

  .field-label{
    font-size: 0.72rem;
    color: var(--amber-dim);
    margin: 0 0 14px;
  }

  .link-list{
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .link-item{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 0;
    text-decoration: none;
    color: var(--text);
    border-bottom: 1px dotted var(--panel-line);
    transition: color 0.15s ease;
  }
  .link-item:last-child{ border-bottom: none; }

  .link-item .key{ color: var(--text); font-size: 0.92rem; }
  .link-item .val{
    color: var(--muted);
    font-size: 0.8rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    direction: rtl;
    text-align: left;
  }

  .link-item:hover,
  .link-item:focus-visible{
    color: var(--amber);
  }
  .link-item:hover .val,
  .link-item:focus-visible .val{
    color: var(--amber-dim);
  }
  .link-item:focus-visible{
    outline: 1px solid var(--amber);
    outline-offset: 4px;
  }

  .games{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .game-card{
    display: block;
    text-decoration: none;
    background: var(--ink);
    border: 1px solid var(--panel-line);
    border-radius: 3px;
    padding: 18px 16px;
    color: var(--text);
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .game-card:hover,
  .game-card:focus-visible{
    border-color: var(--amber-dim);
    transform: translateY(-2px);
  }
  .game-card:focus-visible{
    outline: 1px solid var(--amber);
    outline-offset: 3px;
  }

  .game-card .name{
    font-family: 'Fraunces', serif;
    font-size: 1.15rem;
    font-weight: 600;
    display: block;
    margin-bottom: 6px;
  }
  .game-card .run{
    font-size: 0.72rem;
    color: var(--amber);
  }
  .game-card .run::before{
    content: "▸ ";
  }

  footer{
    margin-top: 24px;
    color: var(--panel-line);
    font-size: 0.72rem;
    text-align: center;
  }

  @media (max-width: 480px){
    .games{ grid-template-columns: 1fr; }
    .identity h1{ font-size: 1.7rem; }
  }

  @media (prefers-reduced-motion: reduce){
    .game-card{ transition: none; }
  }
</style>
</head>
<body>
<main>
  <p class="stmt"><span class="kw">select</span> * <span class="kw">from</span> ricardo;</p>

  <div class="card">
    <div class="row identity">
      <h1>Ricardo</h1>
      <p>Desenvolvedor Delphi Senior (VCL / FMX) e Head de Desenvolvimento</p>
    </div>

    <div class="row">
      <p class="field-label">links</p>
      <div class="link-list">
        <a class="link-item" href="https://github.com/coluce" target="_blank" rel="noopener">
          <span class="key">github</span>
          <span class="val">github.com/coluce</span>
        </a>
        <a class="link-item" href="https://coluce.wordpress.com/" target="_blank" rel="noopener">
          <span class="key">blog</span>
          <span class="val">coluce.wordpress.com</span>
        </a>
      </div>
    </div>

    <div class="row">
      <p class="field-label">jogos</p>
      <div class="games">
        <a class="game-card" href="tower-defense.html">
          <span class="name">Tower Defence</span>
          <span class="run">jogar</span>
        </a>
        <a class="game-card" href="colorir.html">
          <span class="name">Colorir por Números</span>
          <span class="run">jogar</span>
        </a>
      </div>
    </div>
  </div>

  <footer>1 row selected</footer>
</main>
</body>
</html>
