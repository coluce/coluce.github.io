<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meus Jogos</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 50%, #1a1a2e 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  header {
    text-align: center;
    margin-bottom: 50px;
  }

  h1 {
    font-size: clamp(2rem, 5vw, 3rem);
    background: linear-gradient(90deg, #ff6b9d, #c084fc, #60a5fa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 10px;
  }

  header p {
    color: #a0a0b8;
    font-size: 1.1rem;
  }

  .jogos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
    width: 100%;
    max-width: 900px;
  }

  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 30px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--gradient);
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 0;
  }

  .card:hover {
    transform: translateY(-8px);
    border-color: rgba(255, 255, 255, 0.3);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
  }

  .card:hover::before { opacity: 0.15; }

  .card > * { position: relative; z-index: 1; }

  .icone {
    font-size: 3.5rem;
    margin-bottom: 15px;
    display: block;
  }

  .card h2 {
    font-size: 1.5rem;
    margin-bottom: 10px;
  }

  .card p {
    color: #b8b8d0;
    line-height: 1.5;
    font-size: 0.95rem;
  }

  .card-td     { --gradient: linear-gradient(135deg, #ef4444, #f59e0b); }
  .card-colorir{ --gradient: linear-gradient(135deg, #ec4899, #8b5cf6, #06b6d4); }

  .btn-jogar {
    display: inline-block;
    margin-top: 18px;
    padding: 10px 22px;
    border-radius: 50px;
    font-weight: 600;
    font-size: 0.9rem;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    transition: background 0.3s;
  }

  .card:hover .btn-jogar {
    background: rgba(255, 255, 255, 0.25);
  }

  footer {
    margin-top: auto;
    padding-top: 50px;
    color: #666;
    font-size: 0.85rem;
  }
</style>
</head>
<body>

  <header>
    <h1>🎮 Meus Jogos</h1>
    <p>Escolha um jogo para começar</p>
  </header>

  <main class="jogos">
    <a href="tower-defense.html" class="card card-td">
      <span class="icone">🏰</span>
      <h2>Tower Defense</h2>
      <p>Defenda sua base construindo torres estratégicas. Minimalista e desafiador.</p>
      <span class="btn-jogar">Jogar →</span>
    </a>

    <a href="colorir.html" class="card card-colorir">
      <span class="icone">🎨</span>
      <h2>Colorir por Número</h2>
      <p>Pinte desenhos seguindo os números. Diversão garantida para as crianças!</p>
      <span class="btn-jogar">Jogar →</span>
    </a>
  </main>

  <footer>
    © 2026 — 🧑‍💻 Ricardo Coluce
  </footer>

</body>
</html>
